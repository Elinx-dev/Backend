server:
  port: ${SLATE_API_PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: slate-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SLATE_DB_URL:jdbc:postgresql://localhost:5432/slate}
    username: ${SLATE_DB_USER:slate_app}
    password: ${SLATE_DB_PASSWORD:slate_app}
    hikari:
      maximum-pool-size: 15
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    schemas: public
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SLATE_SMTP_HOST:localhost}
    port: ${SLATE_SMTP_PORT:1025}
    username: ${SLATE_SMTP_USERNAME:}
    password: ${SLATE_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SLATE_SMTP_AUTH:false}
          starttls:
            enable: ${SLATE_SMTP_STARTTLS:false}

slate:
  security:
    # true = local demo: demo secrets and mock endpoints are allowed (with a warning).
    # Set SLATE_LOCAL_DEMO=false outside local use; startup then fails on any demo secret.
    local-demo: ${SLATE_LOCAL_DEMO:true}
  cors:
    allowed-origins: ${SLATE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${SLATE_JWT_SECRET:local-demo-only-secret-key-please-override-in-any-real-environment}
    access-token-minutes: ${SLATE_JWT_MINUTES:10}
  session:
    idle-timeout-minutes: ${SLATE_IDLE_TIMEOUT_MINUTES:10}
  otp:
    # Officer login OTP and Aadhaar party-consent OTP are two different things.
    # In the local demo both are served by deterministic mock connectors.
    officer-demo-otp: ${SLATE_OFFICER_OTP:123456}
    aadhaar-demo-otp: ${SLATE_AADHAAR_OTP:123456}
    validity-seconds: 300
  password-reset:
    validity-minutes: ${SLATE_PASSWORD_RESET_MINUTES:15}
  mail:
    # Set enabled=true and provide the spring.mail SMTP settings outside local demo use.
    enabled: ${SLATE_MAIL_ENABLED:false}
    from: ${SLATE_MAIL_FROM:no-reply@slate.gov.in}
    reset-base-url: ${SLATE_RESET_BASE_URL:http://localhost:5173/reset-password}
    expose-demo-secrets: ${SLATE_EXPOSE_DEMO_SECRETS:true}
    # How real emails are sent (login code when LOGIN_EMAIL_OTP is on, password reset):
    # GRAPH = Microsoft 365 Graph sendMail (same as BUMI), SMTP = the spring.mail settings above.
    provider: ${SLATE_MAIL_PROVIDER:GRAPH}
    graph:
      tenant-id: ${SLATE_GRAPH_TENANT_ID:}
      client-id: ${SLATE_GRAPH_CLIENT_ID:}
      client-secret: ${SLATE_GRAPH_CLIENT_SECRET:}
  login-lockout:
    # After 5 wrong passwords a user with lockout on cannot sign in for this long (state admin can unlock earlier).
    minutes: ${SLATE_LOGIN_LOCKOUT_MINUTES:120}
  sms:
    # 2Factor.in, used for the login code once a state's LOGIN_SMS_OTP flag is on.
    two-factor:
      api-key: ${SLATE_SMS_2FACTOR_API_KEY:}
      base-url: ${SLATE_SMS_2FACTOR_BASE_URL:https://2factor.in}
      template: ${SLATE_SMS_2FACTOR_TEMPLATE:}
      sender-id: ${SLATE_SMS_SENDER_ID:}
  aadhaar:
    # Raw Aadhaar is never persisted. Parties are stored as a salted SHA-256 hash
    # plus the last four digits; the salt itself lives outside the database.
    salt: ${SLATE_AADHAAR_SALT:local-demo-aadhaar-salt}
    salt-ref: ${SLATE_AADHAAR_SALT_REF:local-demo-v1}
    # Real Aadhaar OTP gateway (ASA / KUA provider), used for a state once its AADHAAR_OTP_LIVE flag is on.
    live:
      base-url: ${SLATE_AADHAAR_API_URL:}
      api-key: ${SLATE_AADHAAR_API_KEY:}
      otp-path: ${SLATE_AADHAAR_OTP_PATH:/otp/request}
      verify-path: ${SLATE_AADHAAR_VERIFY_PATH:/otp/verify}
      timeout-seconds: ${SLATE_AADHAAR_API_TIMEOUT:15}
  pii:
    # AES-256-GCM key (base64 of 32 bytes) for Aadhaar, PAN, mobile and address at rest.
    # Keep it in a secret store; the local demo key is used when unset. Old keys stay
    # readable via previous-keys ("v0:base64,...") after rotation.
    key: ${SLATE_PII_KEY:}
    key-id: ${SLATE_PII_KEY_ID:v1}
    previous-keys: ${SLATE_PII_PREVIOUS_KEYS:}
  survey:
    tolerance-pct: ${SLATE_SURVEY_TOLERANCE_PCT:1.0}
  vao:
    visit-slots: ${SLATE_VAO_VISIT_SLOTS:09:00,10:30,12:00,14:30,16:00}
  connectors:
    mode: ${SLATE_CONNECTORS_MODE:MOCK}
  rules:
    blocking: ${SLATE_RULES_BLOCKING:false}
  chain:
    enabled: ${SLATE_CHAIN_ENABLED:true}
    # Local Hyperledger Fabric network from fabric/docker-compose.yml (orgs Registration, Revenue, Survey).
    # The crypto path holds local development certificates generated by cryptogen; production identities
    # come from a Fabric CA / HSM and are never kept in the repository.
    fabric:
      crypto-path: ${FABRIC_CRYPTO_PATH:./fabric/organizations}
      channel: ${FABRIC_CHANNEL:slate}
      chaincode: ${FABRIC_CHAINCODE:slateland}
      registration-peer: ${FABRIC_REGISTRATION_PEER:localhost:7051}
      revenue-peer: ${FABRIC_REVENUE_PEER:localhost:8051}
      survey-peer: ${FABRIC_SURVEY_PEER:localhost:9051}

springdoc:
  api-docs:
    enabled: ${SLATE_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SLATE_API_DOCS_ENABLED:true}
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: ${SLATE_MAIL_ENABLED:false}

logging:
  level:
    in.gov.slate: INFO
